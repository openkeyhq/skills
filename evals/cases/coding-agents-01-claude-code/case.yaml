skill: openkey-coding-agents
shape: presentation
mcp: none
max_budget_usd: 0.6
allow: [Read, Glob, Grep, WebFetch]
assert:
  result_regex_all:
    - 'ANTHROPIC_BASE_URL'
    - 'ANTHROPIC_BASE_URL\W+https://api\.openkey\.ai(?!/v1)'   # the Anthropic dialect is the bare host; Claude Code appends /v1/messages
    - 'ANTHROPIC_AUTH_TOKEN'
    - '"apiKeyHelper"\s*:\s*"printenv OPENKEY_API_KEY"'   # the key comes from the helper in a settings file, not a profile export
  result_not_regex: '(?i)((paste|send|share|give|provide|tell)\s+(me\s+)?(your|the)\s+(api\s+|access\s+)?(token|key)\b(?!\s+(into|in|to|out|from|as|via|on|through|using|along|with\s+(every|each|the|all|your|a|an))\b)|what(.s| is) your (api |access )?(token|key))'   # never asks for the key; "put the key in an env var" is advice, not a request
